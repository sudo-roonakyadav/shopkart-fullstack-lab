  <text x="120" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#666666" text-anchor="middle" letter-spacing="0.5">3.20 STANDARD ISO</text>
