<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="100%" height="100%">
  <rect width="240" height="160" fill="#FAFAFA" stroke="#E5E5E5" stroke-width="1"/>
  <!-- Ubuntu Circle of Friends Emblem -->
  <g transform="translate(120, 62)">
    <circle r="36" fill="#E95420"/>
    <circle r="22" fill="#FAFAFA"/>
    <!-- Central white ring -->
    <circle r="18" fill="none" stroke="#E95420" stroke-width="6"/>
    <!-- Three dots -->
    <circle cx="0" cy="-28" r="6" fill="#E95420"/>
    <circle cx="24" cy="14" r="6" fill="#E95420"/>
    <circle cx="-24" cy="14" r="6" fill="#E95420"/>
  </g>
  <!-- Typography -->
  <text x="120" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#111111" text-anchor="middle" letter-spacing="1">UBUNTU</text>
  <text x="120" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#666666" text-anchor="middle" letter-spacing="0.5">24.04 LTS ISO</text>
</svg>
